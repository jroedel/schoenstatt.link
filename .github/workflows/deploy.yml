# Deploy schoenstatt.link from a runner.
#
# THIS IS PUSH-TO-DEPLOY (2026-09-24, the last step of #263). A commit that lands on master
# and goes green in CI ships itself: `workflow_run` fires when CI completes, and there is
# no approval step. `workflow_dispatch` is kept for the deploys that are still a decision —
# a dry run, or a re-deploy of an unchanged tip — but it is no longer the way ordinary work
# reaches production.
#
# WHAT THAT MAKES UNATTENDED, and it is worth naming once: migrations. tools/deploy.sh runs
# the pending `database/*.sql` through the ledger with nobody watching. That path is built
# for it and has every guard it needs — phases, per-file sha256, a snapshot on the server,
# an `@verify` that must return zero rows — but as of this change it has still never run in
# anger. The first merge that carries a migration is the one to watch land.
#
# NOT `push: branches: [master]`. A push trigger fires the instant the merge lands, while
# CI is still queued, so the gate below would ask whether CI passed on a commit CI has not
# finished — and refuse every time. `workflow_run` fires *after* CI, which is the only
# ordering in which the gate can ever be satisfied.
#
# WHY IT CAN NEVER RUN FROM A PULL REQUEST: it has no `pull_request` trigger, and no
# `pull_request_target` either. That matters beyond taste. This repository went public on
# 2026-09-24 (#259), and the one reliable way to keep a fork's pull request away from these
# secrets is not to give it a trigger that could reach them.
#
# `workflow_run` needs its own answer to that, because it is not covered by the same
# reasoning. CI *does* run on a fork's pull request, so a fork can make this workflow's
# trigger fire — and a `workflow_run` job runs in master's context, which means the
# `production` environment's branch restriction sees `refs/heads/master` and passes no
# matter whose commit CI was testing. The branch restriction is therefore NOT the guard
# here. The `if:` on the job is: it demands the run succeeded, that its head branch was
# master, and that its head repository was this one. Removing any of those three hands a
# fork the deploy key.
#
# ONE SECRET IS THE WHOLE CONFIGURATION. DEPLOY_SECRETS_ENV is the deploy section of
# secrets.env — the SSH target, maintenance key, DDL database account, the CI deploy key and
# the pinned host key — uploaded by `make gh-secrets` (tools/gh-secrets.sh). This writes it
# into RUNNER_TEMP rather than into the workspace, and points the script at it with
# SECRETS_ENV. Two reasons: nothing later can sweep it up with the checkout, and `git
# status` stays clean, which the script's own preflight insists on. Production's
# local.php values (APP_*) are never in it.
#
# WHAT STOPS TWO DEPLOYS COLLIDING: `concurrency` serialises this workflow against itself,
# and tools/deploy.sh takes an atomic lock on the server (shared/deploy.lock), which covers
# the case GitHub cannot see — someone running `make prod-deploy` from a laptop at the same
# moment.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preflight and plan only; the server is not modified"
        type: boolean
        default: true
  workflow_run:
    # `workflows` matches on ci.yml's `name:`, not its filename. Renaming CI silently
    # stops every automatic deploy, with no error anywhere — the workflow simply never
    # fires. test/Deploy/workflow-triggers-test.sh holds the two names together.
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-production
  # NOT cancel-in-progress. A run halfway through a symlink swap and a migration is the one
  # thing that must never be killed to make room for a newer one.
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to ask whether CI passed on the commit being deployed

jobs:
  deploy:
    name: ${{ inputs.dry_run && 'Dry run' || 'Deploy master' }}
    runs-on: ubuntu-latest
    environment: production
    # Three conditions, and the header says why each is load-bearing. A dispatch is exempt
    # because only someone with write access can dispatch, and `production` is restricted
    # to master.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      # The commit this run ships, decided once so the checkout, the CI gate and the
      # script's own claim cannot disagree.
      #
      # For a workflow_run event `github.sha` is master's tip AT FIRE TIME, which is not
      # necessarily the commit CI just proved: if a second merge lands during CI's ~7
      # minutes, the run that just went green was testing the older commit while
      # `github.sha` already names the newer one. Deploying that pairing would credit an
      # unverified commit with a green run — exactly what DEPLOY_VERIFIED_SHA exists to
      # prevent. `workflow_run.head_sha` is the commit CI actually tested.
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # tools/deploy.sh reads `git log`, compares against origin/master, and builds the
          # release from `git ls-files`. A shallow clone answers the first two wrongly.
          fetch-depth: 0

      - name: Put the checkout on master, at the commit that was dispatched
        # tools/deploy.sh refuses anything that is not a branch literally named `master`
        # (":1002" — a --ref deploy is meant to be loud), and a runner's checkout is a
        # detached HEAD. `checkout -B` makes that true without depending on what
        # actions/checkout does with a branch ref.
        #
        # The equality check is the part that matters. If master moved on, the commit CI
        # proved green and the commit deploy.sh would ship are different, and deploy.sh
        # would notice but only WARN — and -y forces past a warning. So it is refused here
        # instead.
        #
        # Under workflow_run this is the rapid-merge case and it is benign: the newer
        # commit has its own CI run in flight, and that run's workflow_run will deploy it.
        # The refusal is still loud rather than a quiet skip, because "a deploy did not
        # happen" should never be something you have to go looking for.
        run: |
          git fetch --quiet origin master
          REMOTE=$(git rev-parse origin/master)
          if [ "$REMOTE" != "$TARGET_SHA" ]; then
            echo "::error::master has moved on (this run is for ${TARGET_SHA:0:7}, \
          origin/master is now ${REMOTE:0:7}). Refused. If a newer commit landed, its own \
          CI run deploys it and nothing here needs doing." >&2
            exit 1
          fi
          git checkout -B master "$TARGET_SHA"
          git status --porcelain

      - name: Require CI green on this exact commit
        # tools/deploy.sh normally verifies a release by running ci-local. It cannot here —
        # ci-local drives the Docker capsule, and there is no capsule on a runner. So the
        # gate is this repository's CI, and this step is what makes that a checked fact
        # rather than a comment: it asks whether ci.yml has a successful run for this very
        # SHA, and refuses if not. A green run on the branch is not the same claim.
        #
        # CI runs 3,768 tests of 4,487 — everything but the three suites that need a
        # running application — so this is a floor, not a full rehearsal. The required
        # reviewer on the `production` environment is the rest of it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$TARGET_SHA" -f status=success \
            --jq '.workflow_runs | sort_by(.run_number) | last | .id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::CI has no successful run for $TARGET_SHA. Deploy refused." >&2
            exit 1
          fi
          echo "ci.yml run $RUN_ID passed on ${TARGET_SHA:0:7}"
          echo "CI_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Write the deploy configuration and the SSH trust
        # Outside the workspace on purpose — see the header. Mode 0600 because the file
        # holds the maintenance API key and a database password with DDL rights, and
        # because tools/secrets-env.sh refuses anything looser.
        #
        # The host key is pinned from the bundle, not discovered. `StrictHostKeyChecking=no`
        # would turn a documented atomic deploy into a trust-on-first-use one;
        # tools/deploy.sh refuses rather than guesses everywhere else, and this is the same
        # rule.
        #
        # The deploy key is written by these few lines of our own, deliberately not by
        # webfactory/ssh-agent or any other third-party action: this is the step that
        # handles the private key. It has no passphrase — there is no agent and nobody to
        # type one. Its protection is that it lives in a GitHub secret and that the account
        # it opens is reachable only on port 222. ~/.ssh/config rather than a flag, because
        # tools/deploy.sh builds its own ssh command and passes its own -e string to rsync;
        # a config entry reaches both without the script needing to know it is on a runner.
        env:
          DEPLOY_SECRETS_ENV: ${{ secrets.DEPLOY_SECRETS_ENV }}
        run: |
          umask 077
          # An unset secret reads as empty, not as an error.
          test -n "$DEPLOY_SECRETS_ENV" || { echo "DEPLOY_SECRETS_ENV is not set — run make gh-secrets" >&2; exit 1; }
          CONF="$RUNNER_TEMP/secrets.env"
          printf '%s\n' "$DEPLOY_SECRETS_ENV" > "$CONF"
          chmod 600 "$CONF"
          . tools/secrets-env.sh
          secrets_env_load "$CONF"

          mkdir -p ~/.ssh
          printf '%s' "${DEPLOY_KNOWN_HOSTS_B64:-}" | base64 -d > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "DEPLOY_KNOWN_HOSTS_B64 is missing or empty" >&2; exit 1; }
          printf '%s' "${DEPLOY_CI_SSH_KEY_B64:-}" | base64 -d > ~/.ssh/id_deploy
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts ~/.ssh/id_deploy ~/.ssh/config
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null \
            || { echo "DEPLOY_CI_SSH_KEY_B64 is not a usable passphrase-less private key" >&2; exit 1; }

          # Names only. Never the values, and never `cat` — this log is world-readable.
          printf 'wrote %s holding: ' "$CONF"
          grep -oE '^[A-Z][A-Z0-9_]*=' "$CONF" | tr -d '=' | tr '\n' ' '
          printf '\n'

      - name: Deploy
        # -y because tools/deploy.sh refuses to run without a TTY unless told to; the
        # prompt exists for an UNUSUAL deploy, and on a runner there is nobody to answer
        # it. What replaces it is the environment's required reviewer, who has already said
        # yes before this step starts.
        #
        # DEPLOY_VERIFIED_SHA and _BY rather than --skip-tests. They say the same thing the
        # bare flag would — do not run ci-local — but they say it truthfully: which
        # revision was proven green, and by what. --skip-tests alone would make the script
        # announce that nothing verified this build, which is both wrong and the one
        # warning nobody should learn to ignore. The SHA also keeps the claim honest: if
        # master moved between CI and this dispatch, deploy.sh says so rather than crediting
        # the new commit with the old commit's green run.
        #
        # Every `${{ }}` here is read through `env:` and never interpolated into the script
        # text. None of these values is attacker-controlled today, but a workflow that
        # pastes expressions into a shell is one added input away from being injectable, and
        # the habit is cheaper than the audit.
        env:
          SECRETS_ENV: ${{ runner.temp }}/secrets.env
          DEPLOY_LOCK_OWNER: github-actions/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # CI_RUN_ID comes from the gate step above, so this names the run that actually
          # proved the commit green rather than this deploy's own run. TARGET_SHA comes
          # from the job's env, so the script is told the same commit the gate checked.
          #
          # DRY_RUN is empty on a workflow_run event — `inputs` exists only for a dispatch —
          # and an empty string is not "true", so an automatic deploy is a real one.
          export DEPLOY_VERIFIED_SHA="$TARGET_SHA"
          export DEPLOY_VERIFIED_BY="GitHub Actions CI (run $CI_RUN_ID) passed"
          if [ "$DRY_RUN" = "true" ]; then
            ./tools/deploy.sh --dry-run -y
          else
            ./tools/deploy.sh -y
          fi

      - name: Remove the deploy configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.env" ~/.ssh/id_deploy
