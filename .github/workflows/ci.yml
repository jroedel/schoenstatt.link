# CI for the modernization era. PHP 8.5 = production.
#
# Every job runs the version production executes, and since 2026-08-11 that is
# 8.5, not the 8.4 of rung 4b. `config.platform.php` says 8.5.9 too, and has
# since 2026-09-11: it read 8.4.24 for as long as locked packages capped PHP
# there — twelve of them, laminas-mvc 3.8.0 first among them — and every one of
# those packages has since been removed, so the pin states the runtime instead
# of a ceiling. `composer install` verifies the lock against that recorded
# override, which is why the install below passes here and on the server.
# What did NOT move is vendor/composer/platform_check.php, still `>= 8.4.1`:
# composer writes it from the packages' own requirements, so no release demands
# 8.5 of a server. docs/DEPLOY.md has the detail.
#
# The consequence for these jobs is the point: linting and testing on 8.5 is
# now the only thing standing between an 8.5-only fatal and production, because
# the resolver is deliberately looking at an older PHP than the one that will
# run the code.
#
# lint: syntax-lints every application PHP file.
#
# composer-install: a continuous rehearsal of deploy-day step 4
# (docs/BACKLOG.md "Production deploy checklist"): from a bare checkout, the
# committed composer.phar must install the locked dependency tree with
# --no-dev on PHP 8.5, exactly as production does. This proves on every
# push that the lock stays resolvable from nothing — the VCS forks
# (git clones, no API auth) still exist, the config.platform pins are
# consistent, composer.json and the lock haven't drifted apart — and that
# no non-ignored security advisory has appeared against locked versions.
#
# unit: the test/Unit suite. It requires classes under test directly (no
# vendor autoload, no running app, no DB), so a bare runner suffices.
#
# integration: the test/Integration suite. Needs real vendor/ libraries but
# no running app and no DB, so it rides on a plain composer install.
#
# coding-standard: phpcs on the paths CLAUDE.md declares clean and requires to
# stay clean. Deliberately NOT `composer cs-check`, whose scope has carried no
# signal for years — the job's own comment has the numbers.
#
# deploy-machinery: the test/Deploy/*-test.sh checks. Plain bash, no
# server, and local-only until 2026-09-08 for no reason other than that they
# were written into tools/ci-local.sh and left there.
#
# phpstan: static analysis at level 0, contract "no new errors" against
# phpstan-baseline.neon. It needs vendor/ (bootstrapFiles + class discovery)
# but no DB and no running app. This job exists because the analyzer sat
# broken and unnoticed from rung 4a to 2026-08-04 — phpVersion was still
# pinned to 7.4 against an 8.4 stack, which nothing was running to catch.
# Its `phpVersion` stays 80400 while this runner is on 8.5, and that is a
# limitation rather than a choice: the pinned PHPStan 1.12.13 rejects 80500
# outright ("expects to be 70100..80499"). Raising it means PHPStan 2.x, i.e. a
# tool upgrade with its own error delta, tracked separately. So the analyzer
# reasons about 8.4 semantics; the lint and the two test jobs are what actually
# exercise 8.5.
#
# HOW MUCH THIS ACTUALLY COVERS, because a green tick here overstates it.
# Measured 2026-09-23 on master: unit runs `2365 tests, 4266 assertions` and
# integration `Tests: 1403, Assertions: 4144, Skipped: 37`. The capsule runs those
# two plus smoke (`671 tests, 77672 assertions`) and the fuzz harness, so CI is
# 3,768 tests of 4,487 — but only 8,410 assertions of ~89,000, because the smoke
# suite asserts roughly 116 times per test. The test figure is the honest one for
# "how much is checked"; the assertion figure is why nobody should read a green
# tick as a full rehearsal.
#
# What remains out of reach here is not a database — there is one below, since
# 2026-09-23 — but a *running application*. Smoke, fuzz and smoke-prod.sh drive
# Apache, APCu and a live session, and a service container does not provide those.
#
# What is enforced instead is that the gap stays *named*:
# tools/check-ci-skips.php pins the set of classes that skip, against
# test/known-ci-skips.txt, so a class which used to run here and stops fails by
# name rather than vanishing into the number 195.
#
# The consequence for a reviewer: `./tools/ci-local.sh` is the stricter check,
# not the weaker stand-in. It mirrors these jobs and then runs the smoke suite,
# the fuzz harness and tools/smoke-prod.sh, none of which can run here at all.
#
# Still local-only, and each for a reason rather than by omission:
#
#   - the smoke suite, which needs the capsule's Apache/MariaDB/APCu;
#   - tools/smoke-prod.sh, which the deploy runs against production;
#   - the fuzz harness. Worth spelling out because it looks portable and is
#     not: test/Fuzz/FormRepository pulls Laminas\Db\Adapter\Adapter out of the
#     container to profile the queries a form's value options make, and
#     SchemaColumnWidths reads the live column types. It needs a database as
#     much as the parity tests do.
#
# See docs/BACKLOG.md.
name: CI

# WHY THESE TRIGGERS: `push: branches: ["**"]` together with `pull_request:` fires BOTH on
# every push to a branch with a PR open, so each push cost two identical runs. Billing is
# per job, rounded up to the minute, and this workflow has seven jobs -- so a run is ~7
# minutes however fast it is (a full run is ~80s of wall clock), and the doubled trigger
# made it ~14. Narrowing `push` to master keeps the same coverage: a PR branch is covered
# by `pull_request`, and master is covered on merge.
#
# `concurrency` then cancels a superseded run when a branch is pushed again, which is the
# other half: three pushes in five minutes used to buy three full runs of which only the
# last mattered. master is deliberately NOT cancelled -- every merged commit gets a real
# answer -- which is what the group expression does by falling back to run_id there.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP 8.5 syntax lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - name: php -l all application code
        run: |
          set -eu
          FAILED=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null; then
              FAILED=1
            fi
          done < <(find module config public/index.php test -name '*.php' -print0)
          exit "$FAILED"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      # The unit suite was vendor-free until 2026-09-11, when
      # test/Unit/ElementModelBehaviourTest arrived requiring vendor/autoload.php --
      # and that one `require` is what registers composer's autoloader for the WHOLE
      # suite at collection time, which is why thirty other unit tests can name app
      # classes without requiring anything themselves. Without an install the job dies
      # at collection with exit 255 and no test result at all. It went unnoticed
      # because Actions was disabled two days earlier.
      - name: Install from lock
        run: php composer.phar install --no-dev --no-interaction --no-progress
      - name: Fetch the pinned phpunit phar
        run: bash tools/get-phars.sh phpunit
      - name: Run the unit suite
        run: php tools/phpunit.phar --testsuite unit

  static-analysis:
    name: PHPStan (level 0, no new errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install from lock
        run: php composer.phar install --no-dev --no-interaction --no-progress
      - name: Fetch the pinned phpstan phar
        run: bash tools/get-phars.sh phpstan
      - name: Analyse
        run: php -d memory_limit=1G tools/phpstan.phar analyse --no-progress

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # A database, at last. Until 2026-09-23 there was no way to build one from this
    # repository -- `database/` holds incremental migrations and, of the 48 tables the
    # application uses, only 34 are created by one -- so 37 test classes skipped here on a
    # failed CONNECTION rather than on missing rows, and the job ran ~43% of the
    # assertions the capsule does. `database/ci/base-schema.sql` is the schema and
    # `database/ci/ci-seed.sql` is a small set of invented rows; together they take this job
    # from 3,085 assertions to ~4,227 and from 195 skipped tests to 38.
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: ourlink_db1
          MARIADB_USER: schoenstatt
          MARIADB_PASSWORD: schoenstatt
        ports: ["3306:3306"]
        # Without this the first client connects before the server is listening and the
        # whole job fails on a connection error that reads like a configuration mistake.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          # intl is a hard composer requirement; dom/xmlwriter/mbstring are what
          # PHPUnit needs and zip is PhpSpreadsheet's. apcu is here for the ACL
          # cache tests: the assembled BjyAuthorize ACL has been cached in APCu
          # since 2026-08-22, and test/Integration/AclCacheTest asserts what the
          # stored copy may and may not contain — that no identity is baked into
          # it, and that no per-user role survives in it. Without the extension
          # those tests could only skip, and until 2026-09-08 they did not even
          # manage that: the skip lived in the test body, so the container the
          # test builds threw "ext/apcu is disabled" first and they reported as
          # four errors. RequiresApcu fixed the reporting; this makes them run.
          extensions: intl, mbstring, dom, xmlwriter, zip, apcu
          # apcu is a CLI-hostile extension by default — apc.enable_cli defaults
          # to 0, so the extension loads and every apcu_* call fails. And note
          # what this does NOT buy: a CLI process gets its own segment, so this
          # can never test what the web server's cache holds (see the memory
          # note "APCu segment belongs to its SAPI"). It tests the wiring.
          ini-values: apc.enable_cli=1
          coverage: none
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install from lock
        run: php composer.phar install --no-dev --no-interaction --no-progress
      - name: Fetch the pinned phpunit phar
        run: bash tools/get-phars.sh phpunit
      - name: Build the database
        # The schema, then the rows. Both are tracked and both are readable: no production
        # export is involved and none ever should be. ci-seed.sql empties what it fills, so
        # re-running it is a no-op rather than a duplicate-key error.
        run: |
          mysql -h 127.0.0.1 -P 3306 -uschoenstatt -pschoenstatt ourlink_db1 < database/ci/base-schema.sql
          mysql -h 127.0.0.1 -P 3306 -uschoenstatt -pschoenstatt ourlink_db1 < database/ci/ci-seed.sql
      - name: Create the writable directories
        # The same three config.sh creates, and for the same reason: they are gitignored,
        # so a fresh checkout has none of them. Without data/config the merged-config write
        # in App\Modules\ModuleConfig fails its rename() and emits a PHP warning per test
        # that builds a container -- 21 of them -- and phpunit.xml.dist sets
        # failOnWarning="true", so the suite reports every assertion passing and still exits
        # non-zero. Nothing in the output says "directory".
        run: mkdir -p data/config data/logs data/cache/twig
      - name: Point the application at it
        # Written rather than committed, because config/autoload/local.php is per-machine
        # by design and 27 of these classes skip on `is_readable()` of exactly this path.
        #
        # `driver_options` must be PRESENT, even empty. Two different callers disagree
        # about that and only one of them is lenient: SionModel\Db\Connection::fromCredentials
        # requires database/hostname/username/password and treats driver_options as
        # optional, while App\Application\Service\DbConnectionFactory requires all five and
        # refuses the service without it. Leaving it out cost a full CI run: the container
        # could not build a connection, so 191 tests skipped and the database sat unused
        # while every step reported success.
        #
        # The init command is the capsule's, for the reason docker/local.docker.php gives:
        # in MariaDB `utf8` means utf8mb3, so a connection opened without this truncates
        # anything outside the BMP on the way out of utf8mb4 tables.
        run: |
          cat > config/autoload/local.php <<'PHP'
          <?php
          return [
              'db' => [
                  'driver'   => 'pdo_mysql',
                  'hostname' => '127.0.0.1',
                  'port'     => 3306,
                  'database' => 'ourlink_db1',
                  'username' => 'schoenstatt',
                  'password' => 'schoenstatt',
                  'driver_options' => [
                      (class_exists('Pdo\Mysql') ? \Pdo\Mysql::ATTR_INIT_COMMAND : \PDO::MYSQL_ATTR_INIT_COMMAND)
                          => 'SET NAMES utf8mb4;',
                  ],
              ],
              // Dummy values, not secrets -- the capsule's are dummies too. Without them
              // CacheStatusEndpointTest, HealthRevisionTest and JwtRoundTripTest skip on
              // configuration rather than on anything about a runner, which would be three
              // baseline lines documenting nothing but an omission here. The cypher key is
              // 32 bytes because php-jwt refuses a shorter one.
              'sion_model' => ['api_keys' => ['ci-only-api-key']],
              'schoenstatt' => ['api_keys' => ['ci-only-api-key']],
              'ApiRequest' => ['jwtAuth' => ['cypherKey' => 'ci-only-cypher-key-32-bytes-long!']],
          ];
          PHP
      - name: Run the integration suite
        # memory_limit=1G for the same reason the fuzz job needs it, and since
        # batch 10 for the same code: three of these tests build every form in
        # the application through test/Fuzz/FormRepository. 512M dies partway.
        #
        # --log-junit is for the step below and costs nothing here.
        run: >
          php -d memory_limit=1G tools/phpunit.phar --testsuite integration
          --log-junit integration-junit.xml
        env:
          # CallNumberRequirementTest builds a PDO of its own rather than going through the
          # container, and its fallback host is the capsule's service name -- `getenv('DB_HOST')
          # ?: 'db'`. On a runner that resolves to nothing, so the seam has to be fed.
          DB_HOST: 127.0.0.1
          DB_NAME: ourlink_db1
          DB_USER: schoenstatt
          DB_PASS: schoenstatt
          # Says which corpus this is. Five classes compare against baselines recorded on
          # the capsule's 498 associations -- `authors` alone offers 1,890 options there
          # and six here -- so against the seed they would answer a different question.
          # They skip on this rather than being re-recorded per environment, which would
          # leave them asserting nothing. Unset anywhere else, so forgetting it is a red
          # build rather than a false green.
          SCHOENSTATT_TEST_CORPUS: seed

      - name: Every skipped class says why it cannot run here
        # This job runs a little over half the assertions the capsule does — no
        # database, no production data, no base schema to build one from — and
        # a green tick said nothing about the rest. tools/check-ci-skips.php
        # pins the *set of classes* that skip, so a class which used to run and
        # now does not fails the build by name instead of disappearing into a
        # count. test/known-ci-skips.txt carries the reason for each.
        #
        # Runs even if the suite failed: a failure plus a new skip is two
        # findings, and the second one is the one nobody would go looking for.
        if: always()
        run: php tools/check-ci-skips.php --bare integration-junit.xml

  composer-install:
    name: composer install --no-dev (deploy rehearsal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - name: composer.json and lock agree
        run: php composer.phar validate --no-check-publish
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install from lock, production style
        run: php composer.phar install --no-dev --no-interaction --no-progress
      - name: Autoload sanity
        run: |
          php -r '
            require "vendor/autoload.php";
            $classes = [
                "App\\Kernel",
                "Application\\Module",
                "SionModel\\Db\\Model\\SionTable",
                "JUser\\Service\\LoginTokenService",
                "JTranslate\\Model\\TranslationsTable",
            ];
            foreach ($classes as $class) {
                if (! class_exists($class)) {
                    fwrite(STDERR, "NOT AUTOLOADABLE: $class\n");
                    exit(1);
                }
            }
            echo "autoload ok\n";
          '
      - name: No new security advisories against locked versions
        run: php composer.phar audit --locked

  coding-standard:
    name: PSR-12 on the paths that must stay clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          # phpcs needs the tokenizer to parse and SimpleXML/xmlwriter to read
          # its own ruleset and emit reports. The host PHP that runs the capsule
          # lacks all three, which is why the local command goes through docker.
          extensions: intl, mbstring, dom, xmlwriter, simplexml, tokenizer
          coverage: none
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      # phpcs is a dev dependency, so this is the one job that installs WITH dev.
      - name: Install from lock
        run: php composer.phar install --no-interaction --no-progress
      - name: phpcs
        # The path list lives in tools/phpcs-clean-paths.txt, which this job and
        # the matching step in tools/ci-local.sh both read, so the two cannot
        # drift. That file carries the reasoning, including the three paths that
        # do NOT follow from their location and must be named explicitly.
        run: |
          set -eu
          mapfile -t PATHS < <(sed 's/#.*//' tools/phpcs-clean-paths.txt | grep -v '^[[:space:]]*$')
          echo "checking ${#PATHS[@]} paths"
          php vendor/bin/phpcs -q --report=full "${PATHS[@]}"

  deploy-machinery:
    name: Deploy machinery (bash, no server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - name: test/Deploy/*-test.sh
        # tools/deploy.sh is the least-tested code in the repository that can do
        # the most damage, and these checks — the remote-call machinery, the
        # per-segment cache gate, the OPcache symlink-swap reproduction, the
        # interned-strings sampler, the smoke script's cache-status parsing and the
        # migration inventory —
        # ran only in tools/ci-local.sh until now. They are plain bash and need
        # no server, so there was never a reason for CI not to run them; they
        # were simply written into the local runner and left there.
        #
        # opcache-swap-test.sh is the one exception and reports SKIPPED here: it
        # needs warm PHP workers to reproduce the hazard, so it wants the
        # capsule. It exits 0 rather than failing, deliberately — see its own
        # comment. The other four are the full check.
        #
        # The glob is the same deliberate choice tools/ci-local.sh makes: a new
        # test/Deploy/*-test.sh is picked up without editing this file.
        run: |
          set -eu
          FAILED=0
          for check in test/Deploy/*-test.sh; do
            echo "--- $check"
            if ! bash "$check"; then
              FAILED=1
            fi
          done
          exit "$FAILED"
