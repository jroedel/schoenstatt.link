# CI for the modernization era. PHP 8.4 = production (flipped at rung 4b).
#
# lint: syntax-lints every application PHP file, submodules included.
#
# composer-install: a continuous rehearsal of deploy-day step 4
# (docs/BACKLOG.md "Production deploy checklist"): from a bare checkout, the
# committed composer.phar must install the locked dependency tree with
# --no-dev on PHP 8.4, exactly as production will. This proves on every
# push that the lock stays resolvable from nothing — the VCS forks
# (git clones, no API auth) still exist, the config.platform pins are
# consistent, composer.json and the lock haven't drifted apart — and that
# no non-ignored security advisory has appeared against locked versions.
#
# unit: the test/Unit suite. It requires classes under test directly (no
# vendor autoload, no running app, no DB), so a bare runner suffices.
#
# integration: the test/Integration suite. Needs real vendor/ libraries but
# no running app and no DB, so it rides on a plain composer install.
#
# phpstan: static analysis at level 0, contract "no new errors" against
# phpstan-baseline.neon. It needs vendor/ (bootstrapFiles + class discovery)
# but no DB and no running app. This job exists because the analyzer sat
# broken and unnoticed from rung 4a to 2026-08-04 — phpVersion was still
# pinned to 7.4 against an 8.4 stack, which nothing was running to catch.
#
# Still local-only: the smoke suite (needs the docker time capsule with a
# production DB dump) — see docs/BACKLOG.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: PHP 8.4 syntax lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: php -l all application code
        run: |
          set -eu
          FAILED=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null; then
              FAILED=1
            fi
          done < <(find module config public/index.php test -name '*.php' -print0)
          exit "$FAILED"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Fetch the pinned phpunit phar
        run: bash tools/get-phars.sh phpunit
      - name: Run the unit suite
        run: php tools/phpunit.phar --testsuite unit

  static-analysis:
    name: PHPStan (level 0, no new errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install from lock
        run: php composer.phar install --no-dev --no-interaction --no-progress
      - name: Fetch the pinned phpstan phar
        run: bash tools/get-phars.sh phpstan
      - name: Analyse
        run: php -d memory_limit=1G tools/phpstan.phar analyse --no-progress

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # intl is a hard composer requirement; the rest are what PHPUnit and
          # PhpSpreadsheet need and the host PHP does not carry by default.
          extensions: intl, mbstring, dom, xmlwriter, zip
          coverage: none
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install from lock
        run: php composer.phar install --no-dev --no-interaction --no-progress
      - name: Fetch the pinned phpunit phar
        run: bash tools/get-phars.sh phpunit
      - name: Run the integration suite
        run: php tools/phpunit.phar --testsuite integration

  composer-install:
    name: composer install --no-dev (deploy rehearsal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: composer.json and lock agree
        run: php composer.phar validate --no-check-publish
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install from lock, production style
        run: php composer.phar install --no-dev --no-interaction --no-progress
      - name: Autoload sanity
        run: |
          php -r '
            require "vendor/autoload.php";
            $classes = [
                "Laminas\\Mvc\\Application",
                "Application\\Module",
                "SionModel\\Db\\Model\\SionTable",
                "JUser\\Service\\LoginTokenService",
                "JTranslate\\Model\\TranslationsTable",
            ];
            foreach ($classes as $class) {
                if (! class_exists($class)) {
                    fwrite(STDERR, "NOT AUTOLOADABLE: $class\n");
                    exit(1);
                }
            }
            echo "autoload ok\n";
          '
      - name: No new security advisories against locked versions
        run: php composer.phar audit --locked
