; Runaway-request protection for the time capsule.
;
; public/index.php raises memory_limit to 512M at runtime, so this value is the
; floor for anything that runs *before* the app bootstraps (and for CLI). The
; real ceiling is enforced by the container's mem_limit plus Apache's
; MaxRequestWorkers — see docker/apache-limits.conf.
memory_limit = 512M

; A PHP-level loop burning CPU gets killed after a minute instead of pinning a
; core indefinitely. Note this counts CPU time only: it does not interrupt a
; query blocked in MariaDB, which is why the Apache Timeout is set as well.
max_execution_time = 60

; Cap request parsing so a malformed or hostile upload cannot balloon a worker.
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M
