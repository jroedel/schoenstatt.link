<VirtualHost *:80>
    ServerName schoenstatt.localhost
    DocumentRoot /var/www/schoenstatt.link/public
    SetEnv APP_ENV "development"
    # Put the Symfony kernel in front (public/index.php branches on this). The
    # capsule runs the new front controller so the smoke suite exercises it;
    # production stays on the laminas path until its .htaccess sets this too.
    # Flip to "0" and reload Apache to A/B the two front controllers.
    SetEnv SYMFONY_KERNEL "1"

    <Directory /var/www/schoenstatt.link/public>
        DirectoryIndex index.php
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
