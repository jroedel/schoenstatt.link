<VirtualHost *:80>
    ServerName schoenstatt.localhost
    DocumentRoot /var/www/schoenstatt.link/public
    SetEnv APP_ENV "development"
    # The SYMFONY_KERNEL canary was retired 2026-09-08: public/index.php runs
    # App\Kernel unconditionally now, so this SetEnv is gone. Nothing reads the
    # variable any more. See docs/strangler.md, "The endgame".

    <Directory /var/www/schoenstatt.link/public>
        DirectoryIndex index.php
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
