<VirtualHost *:80>
    ServerName schoenstatt.localhost
    DocumentRoot /var/www/schoenstatt.link/public
    SetEnv APP_ENV "development"

    <Directory /var/www/schoenstatt.link/public>
        DirectoryIndex index.php
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
