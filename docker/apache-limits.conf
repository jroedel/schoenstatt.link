# Resource ceilings for the time capsule's Apache.
#
# The stock php:*-apache image ships mpm_prefork with MaxRequestWorkers 150.
# Combined with the app's own `ini_set('memory_limit', '512M')` (public/index.php)
# that is a 75 GB ceiling with nothing bounding it — on 2026-08-02 a wedged app
# under concurrent smoke-test load exhausted the host twice.
#
# Six workers x 512M ~= 3G, which is exactly the container's mem_limit in
# docker-compose.yml. The cgroup limit is therefore a genuine backstop rather
# than something that fires during normal use.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        6
    # Recycle children regularly so a slow leak in a long-lived worker cannot
    # accumulate across requests.
    MaxConnectionsPerChild 200
</IfModule>

# Do not let a wedged request hold a worker forever; with only 6 workers,
# six hung requests would otherwise deadlock the whole site.
Timeout 60
