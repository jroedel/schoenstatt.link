# Local "time capsule" environment: reproduces production as verified 2026-08-01
# (PHP 7.4.33 + Apache, MariaDB 10.11). See CLAUDE.md, "Modernization mandate".
#
#   docker compose up -d          # app: http://localhost:8080, mail UI: http://localhost:8025
#
# Database: drop a production dump (.sql or .sql.gz) into database/dumps/ BEFORE
# the first `up` — MariaDB imports docker-entrypoint-initdb.d only when its data
# volume is empty. To re-import: docker compose down -v && docker compose up -d

services:
  app:
    build:
      context: ./docker
      args:
        # PHP_VERSION=8.3 (with APCU_VERSION=5.1.24) switches the capsule to the
        # rung-4 target; see docker/Dockerfile. Set both in .env.
        PHP_VERSION: ${PHP_VERSION:-7.4}
        APCU_VERSION: ${APCU_VERSION:-5.1.22}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/schoenstatt.link
      - ./docker/local.docker.php:/var/www/schoenstatt.link/config/autoload/local.php
    environment:
      APP_ENV: development
    # Hard ceilings. On 2026-08-02 a wedged app under concurrent smoke-test load
    # exhausted the host's RAM twice and pinned every core: nothing bounded
    # Apache's 150 default workers x the app's 512M memory_limit. Measured, this
    # app really does spend ~500M on a single page render, so those defaults had
    # a ~75 GB ceiling on a 15.5 GB host.
    #
    # Sizing: 6 workers (docker/apache-limits.conf) x 512M = 3G, plus APCu's
    # 256M shm, opcache and the Apache parent — call it 3.5G. 4g leaves real
    # headroom so the cgroup backstops a runaway instead of OOM-killing ordinary
    # requests; a flat 3g was measured OOM-killing a worker at full concurrency.
    # memswap_limit == mem_limit denies the container swap, so a leak dies fast
    # instead of thrashing the disk and dragging the desktop down with it.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2.0
    pids_limit: 256
    depends_on:
      - db
      - mailpit

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      # Must match the CREATE DATABASE inside the production dump
      MARIADB_DATABASE: ourlink_db1
      MARIADB_USER: schoenstatt
      MARIADB_PASSWORD: schoenstatt
      # The one setting that actually stops this container being OOM-killed, and it
      # is not a MariaDB setting at all.
      #
      # thread_handling is one-thread-per-connection, and a `composer smoke` run
      # opens roughly 3,000 connections in sequence. glibc gives each new thread its
      # own malloc arena and never returns that memory to the OS, so RSS climbs with
      # the *total* number of connections a run makes — not with how many are open at
      # once. Measured: the db held 858 MB of anonymous memory (cgroup memory.stat,
      # `file` was 7 MB, so page cache is not the story) while serving a smoke suite
      # whose peak concurrency is **2**. MariaDB's own Memory_used accounted for only
      # 451 MB of it; the rest was arena growth. Four OOM kills (exit 137,
      # OOMKilled=true) across `tools/ci-local.sh` runs came from this, each one
      # surfacing as ~300 smoke failures and `getaddrinfo for db failed` — which
      # reads as a network fault, not a memory one.
      #
      # With the arenas bounded to 2, the identical full integration run holds at
      # 160 MB against 858 MB before. Capping max_connections does nothing here: it
      # bounds concurrency, and concurrency was never the multiplier.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - db-data:/var/lib/mysql
      # Contains the production dump plus the zz-db*.sql migrations newer than
      # it — initdb runs files alphabetically, which is what the zz- prefix is
      # for. This directory is gitignored, so after adding a migration under
      # database/ you have to copy it here as zz-<name>.sql on each machine or a
      # `docker compose down -v` re-import silently loses it.
      - ./database/dumps:/docker-entrypoint-initdb.d:ro
    ports:
      - "33306:3306"
    # 50, against MariaDB's default of 151, and it is a guard rail rather than the
    # fix for anything — see MALLOC_ARENA_MAX above, which is the fix.
    #
    # The floor is measured, not guessed: with the cap lifted, one `composer
    # integration` run peaks at 36 concurrent connections. An earlier attempt at 20
    # sat under that floor and the failure was invisible — 21 connections refused,
    # and 21 integration tests turned into *skips* rather than failures, because
    # their setUp() catches a connection error and calls markTestSkipped('no
    # reachable database'). `tools/ci-local.sh` printed `ok integration` for a run
    # that had quietly stopped testing 21 things. A cap below the real demand is
    # worse than no cap: it does not fail, it under-reports.
    #
    # 50 leaves headroom over 36 for a mysql client, a bin/console and a suite that
    # grows, while still turning genuine exhaustion into "Too many connections" at
    # the connection that could not be made.
    command: --max-connections=50
    # 10.11's default innodb_buffer_pool_size is 128M; 1g leaves ample room for
    # sort buffers and temp tables on this dataset while capping a runaway join.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64

volumes:
  db-data:
