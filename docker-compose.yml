# Local "time capsule" environment: reproduces production as verified 2026-08-01
# (PHP 7.4.33 + Apache, MariaDB 10.11). See CLAUDE.md, "Modernization mandate".
#
#   docker compose up -d          # app: http://localhost:8080, mail UI: http://localhost:8025
#
# Database: drop a production dump (.sql or .sql.gz) into database/dumps/ BEFORE
# the first `up` — MariaDB imports docker-entrypoint-initdb.d only when its data
# volume is empty. To re-import: docker compose down -v && docker compose up -d

services:
  app:
    build:
      context: ./docker
      args:
        # PHP_VERSION=8.3 (with APCU_VERSION=5.1.24) switches the capsule to the
        # rung-4 target; see docker/Dockerfile. Set both in .env.
        PHP_VERSION: ${PHP_VERSION:-7.4}
        APCU_VERSION: ${APCU_VERSION:-5.1.22}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/schoenstatt.link
      - ./docker/local.docker.php:/var/www/schoenstatt.link/config/autoload/local.php
    environment:
      APP_ENV: development
    # Hard ceilings. On 2026-08-02 a wedged app under concurrent smoke-test load
    # exhausted the host's RAM twice and pinned every core: nothing bounded
    # Apache's 150 default workers x the app's 512M memory_limit. Measured, this
    # app really does spend ~500M on a single page render, so those defaults had
    # a ~75 GB ceiling on a 15.5 GB host.
    #
    # Sizing: 6 workers (docker/apache-limits.conf) x 512M = 3G, plus APCu's
    # 256M shm, opcache and the Apache parent — call it 3.5G. 4g leaves real
    # headroom so the cgroup backstops a runaway instead of OOM-killing ordinary
    # requests; a flat 3g was measured OOM-killing a worker at full concurrency.
    # memswap_limit == mem_limit denies the container swap, so a leak dies fast
    # instead of thrashing the disk and dragging the desktop down with it.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2.0
    pids_limit: 256
    depends_on:
      - db
      - mailpit

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      # Must match the CREATE DATABASE inside the production dump
      MARIADB_DATABASE: ourlink_db1
      MARIADB_USER: schoenstatt
      MARIADB_PASSWORD: schoenstatt
    volumes:
      - db-data:/var/lib/mysql
      # Contains the production dump plus the zz-db*.sql migrations newer than
      # it — initdb runs files alphabetically, which is what the zz- prefix is
      # for. This directory is gitignored, so after adding a migration under
      # database/ you have to copy it here as zz-<name>.sql on each machine or a
      # `docker compose down -v` re-import silently loses it.
      - ./database/dumps:/docker-entrypoint-initdb.d:ro
    ports:
      - "33306:3306"
    # 10.11's default innodb_buffer_pool_size is 128M; 1g leaves ample room for
    # sort buffers and temp tables on this dataset while capping a runaway join.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64

volumes:
  db-data:
